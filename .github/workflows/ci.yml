name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq verilator
          verilator --version
      - name: install package
        run: pip install -e . pytest
      - name: the flow really measures coverage
        run: |
          cd bench/rtl
          make cov
          test -s obj/cov.dat || (echo "coverage.dat was not written" && exit 1)
          grep -q "SF:alu.v" coverage.info
      - name: unit tests
        run: pytest -q tests -k "not llm"
      - name: the hole analyser finds the known holes
        # exit 2 means "holes remain", which is the correct answer for the
        # lazy testbench this repo ships. The assertion is that the known
        # four opcodes are named, not that the exit code is 0.
        run: |
          set +e
          python -m covagent holes --dir bench/rtl --rtl alu.v > holes.txt
          rc=$?
          cat holes.txt
          test $rc -eq 2 || (echo "expected exit 2 (holes remain), got $rc" && exit 1)
          grep -q "3'd2" holes.txt || (echo "the AND hole was not reported" && exit 1)
          grep -q "op" holes.txt || (echo "the case selector was not named" && exit 1)
