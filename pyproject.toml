[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covagent"
version = "0.1.0"
description = "Coverage closure for RTL: name the dark lines, generate stimulus, keep only what the simulator confirms"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Zhang Yangyi", email = "2936745@qq.com"}]
keywords = ["coverage", "verification", "eda", "llm", "verilator", "rtl"]
classifiers = [
  "Topic::Scientific/Engineering::Electronic Design Automation (EDA)",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/ZhangYangyi03/covagent"

[tool.setuptools]
packages = ["covagent"]
